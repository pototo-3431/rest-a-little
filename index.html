<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>休息一下 · 温泉旅店</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#f9e9c8,#e7d5b5);color:#573d29;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.loading-card{width:min(100%,420px);padding:clamp(22px,5vw,42px);border:6px double #9d734d;border-radius:16px;background:#fff3dd;box-shadow:0 5px 0 #8b633648;text-align:center}
h1{margin:0 0 22px;font:700 clamp(28px,7vw,42px)/1.2 "Songti SC",SimSun,serif;letter-spacing:.1em}
progress{display:block;width:100%;height:14px;appearance:none;border:1px solid #bca885;border-radius:8px;overflow:hidden;background:#e9dcc1;accent-color:#65794d}
progress::-webkit-progress-bar{background:#e9dcc1}
progress::-webkit-progress-value{background:#65794d;border-radius:7px}
progress::-moz-progress-bar{background:#65794d;border-radius:7px}
.status{display:flex;justify-content:space-between;gap:12px;margin:10px 0 0;font-size:14px;color:#624e38;text-align:left}
button{margin-top:16px;padding:7px 18px;border:1px solid #64734f;border-radius:6px;background:#65794d;color:#fff9ea;font:inherit;cursor:pointer}
</style>
</head>
<body>
<section class="loading-card" aria-labelledby="title">
<h1 id="title">休息一下</h1>
<progress id="progress" aria-label="试玩资源下载进度" max="100" value="0"></progress>
<p class="status"><span id="status" role="status">正在下载试玩资源…</span><span id="percent" aria-hidden="true">0%</span></p>
<button id="retry" type="button" hidden>重新加载</button>
</section>
<script>
const bar=document.getElementById('progress');
const percent=document.getElementById('percent');
const status=document.getElementById('status');
const retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
async function loadGame(){
  const response=await fetch('./game.bin?v=3762ff76eafa');
  if(!response.ok||!response.body)throw new Error('HTTP '+response.status);
  let received=0;
  const track=new TransformStream({transform(chunk,controller){
    received+=chunk.byteLength;
    const value=Math.min(99,Math.floor(received*100/18887844));
    if(bar.value!==value){bar.value=value;percent.textContent=value+'%';}
    controller.enqueue(chunk);
  },flush(){
    bar.value=100;
    percent.textContent='100%';
    status.textContent='正在打开旅店…';
  }});
  const stream=response.body.pipeThrough(track).pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
}
loadGame().catch(error=>{
  console.error(error);
  status.textContent='加载失败，请重试。';
  retry.hidden=false;
});
</script>
</body>
</html>
