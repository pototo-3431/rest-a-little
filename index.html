<body>
<section class="loading-card" aria-labelledby="title">
<h1 id="title">休息一下</h1>
<div id="progress-run" class="progress-run">
  <div class="runner-lane" aria-hidden="true"><span class="runner"></span></div>
  <progress id="progress" aria-label="试玩资源下载进度" max="100" value="0"></progress>
</div>
<p class="status"><span id="status" role="status">主厨正在假装一切都在掌握之中……</span><span id="percent" aria-hidden="true">0%</span></p>
<p id="download-detail" class="download-detail" aria-live="polite"></p>
<button id="retry" type="button" hidden>重新加载</button>
</section>
<script>
const bar=document.getElementById('progress');
const course=document.getElementById('progress-run');
const percent=document.getElementById('percent');
const status=document.getElementById('status');
const retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
function updateProgress(value){
  if(bar.value===value)return;
  bar.value=value;
  percent.textContent=value+'%';
  course.style.setProperty('--runner-progress',value+'%');
}
const chunks=[{"url":"game-6458be9d305f-0.bin","bytes":1048576},{"url":"game-6458be9d305f-1.bin","bytes":1048576},{"url":"game-6458be9d305f-2.bin","bytes":1048576},{"url":"game-6458be9d305f-3.bin","bytes":1048576},{"url":"game-6458be9d305f-4.bin","bytes":1048576},{"url":"game-6458be9d305f-5.bin","bytes":1048576},{"url":"game-6458be9d305f-6.bin","bytes":1048576},{"url":"game-6458be9d305f-7.bin","bytes":1048576},{"url":"game-6458be9d305f-8.bin","bytes":1048576},{"url":"game-6458be9d305f-9.bin","bytes":1048576},{"url":"game-6458be9d305f-10.bin","bytes":1048576},{"url":"game-6458be9d305f-11.bin","bytes":1048576},{"url":"game-6458be9d305f-12.bin","bytes":1048576},{"url":"game-6458be9d305f-13.bin","bytes":1048576},{"url":"game-6458be9d305f-14.bin","bytes":388773}];
const totalBytes=chunks.reduce((sum,chunk)=>sum+chunk.bytes,0);
const loaded=chunks.map(()=>0);
const detail=document.getElementById('download-detail');
const controller=new AbortController();
let nextChunk=0,failed=false,downloadStarted=0,updateTimer=0;
const received=()=>loaded.reduce((sum,bytes)=>sum+bytes,0);
function showTransfer(){
  const bytes=received();
  updateProgress(Math.min(99,Math.floor(bytes*100/totalBytes)));
  const seconds=Math.max(1,(performance.now()-downloadStarted)/1000);
  const speed=bytes/seconds;
  const rate=speed>=1024*1024?(speed/1024/1024).toFixed(1)+' MB/s':Math.round(speed/1024)+' KB/s';
  detail.textContent=(bytes/1024/1024).toFixed(1)+' / '+(totalBytes/1024/1024).toFixed(1)+' MB · '+rate;
}
async function downloadChunk(index){
  const chunk=chunks[index];
  for(let attempt=0;attempt<3;attempt++){
    if(controller.signal.aborted)throw new Error('cancelled');
    const request=new AbortController();
    const cancel=()=>request.abort();
    controller.signal.addEventListener('abort',cancel,{once:true});
    let watchdog;
    const resetWatchdog=()=>{
      clearTimeout(watchdog);
      watchdog=setTimeout(()=>request.abort(),20000);
    };
    try{
      loaded[index]=0;resetWatchdog();
      const response=await fetch('./'+chunk.url,{signal:request.signal});
      if(!response.ok||!response.body)throw new Error('HTTP '+response.status);
      const reader=response.body.getReader(),pieces=[];
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        resetWatchdog();pieces.push(value);loaded[index]+=value.byteLength;
      }
      if(loaded[index]!==chunk.bytes)throw new Error('Incomplete download');
      return new Blob(pieces);
    }catch(error){
      loaded[index]=0;
      if(attempt===2||controller.signal.aborted)throw error;
      detail.textContent='连接较慢，正在重新连接…';
    }finally{
      clearTimeout(watchdog);
      controller.signal.removeEventListener('abort',cancel);
    }
  }
}
async function loadGame(){
  if(!globalThis.DecompressionStream){
    throw new Error('BROWSER_TOO_OLD');
  }
  downloadStarted=performance.now();
  updateTimer=setInterval(showTransfer,300);
  const parts=new Array(chunks.length);
  async function worker(){
    while(nextChunk<chunks.length&&!failed){
      const index=nextChunk++;
      try{parts[index]=await downloadChunk(index);}
      catch(error){failed=true;controller.abort();throw error;}
    }
  }
  await Promise.all(Array.from({length:3},worker));
  clearInterval(updateTimer);
  updateProgress(100);
  detail.textContent='下载完成，正在准备旅店…';
  const stream=new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
}
loadGame().catch(error=>{
  console.error(error);
  clearInterval(updateTimer);
  controller.abort();
  status.textContent='加载暂时中断。';
  detail.textContent=error.message==='BROWSER_TOO_OLD'?'请更新浏览器后重新打开。':'连接超时或下载失败，点下方重试。';
  course.dataset.failed='';
  retry.hidden=false;
});
</script>
